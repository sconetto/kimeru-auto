name: Security Audit

on:
  schedule:
    - cron: "0 6 * * 1" # Weekly, Monday 06:00 UTC
  workflow_dispatch:

jobs:
  audit:
    name: npm audit + Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (production deps)
        run: npm audit --omit=dev
        continue-on-error: true # findings are reported, not fatal

      - name: Run Semgrep
        # returntocorp/semgrep-action is archived and has no v2 tag; run the
        # official semgrep/semgrep Docker image with the community rule set.
        run: docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep:1.171.0 semgrep scan --config=auto /src
