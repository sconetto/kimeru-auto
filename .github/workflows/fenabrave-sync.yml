name: FENABRAVE Sync (monthly)

on:
  schedule:
    # The report for month M is published during the first days of M+1, but the
    # exact day varies (and the portal has answered 404 intermittently). Run
    # daily from the 2nd to the 10th: a 404 is treated as "not published yet",
    # and the run becomes a real failure only after the day-10 deadline.
    - cron: "0 6 2-10 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Report month (1-12). Empty = previous month."
        required: false
      year:
        description: "Report year. Empty = previous month."
        required: false
      force:
        description: "Re-import even if the month was already ingested (backfill)."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Sync FENABRAVE registration rankings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run FENABRAVE sync
        run: npm run fenabrave:sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          FENABRAVE_MONTH: ${{ inputs.month }}
          FENABRAVE_YEAR: ${{ inputs.year }}
          FENABRAVE_FORCE_REIMPORT: ${{ inputs.force }}

      - name: Open an issue when the sync fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'FENABRAVE sync failed';
            const body = [
              'The monthly FENABRAVE sync failed, so sales data stays at the last',
              'successfully ingested month.',
              '',
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Commit: ${context.sha}`,
              `- Time: ${new Date().toISOString()}`,
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = open.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
