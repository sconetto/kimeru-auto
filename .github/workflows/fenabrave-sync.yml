name: FENABRAVE Sync (monthly)

on:
  schedule:
    - cron: "0 6 3 * *" # 3rd day of month, 06:00 UTC (report for month M is published in M+1)
  workflow_dispatch:

jobs:
  sync:
    name: Sync FENABRAVE registration rankings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run FENABRAVE sync
        run: npm run fenabrave:sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
