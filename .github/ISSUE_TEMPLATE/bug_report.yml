name: Bug Report
description: Report a reproducible bug in Kimeru Auto
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: url
    attributes:
      label: Page URL
      description: Which page or route were you on?
      placeholder: https://kimeruauto.com.br/comparar
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug you observed. What did you expect to happen instead?
      placeholder: Tell us what went wrong!
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: dropdown
    id: browsers
    attributes:
      label: What browser(s) are you seeing the problem on?
      multiple: true
      options:
        - Chrome
        - Firefox
        - Safari
        - Microsoft Edge
        - Mobile (Android)
        - Mobile (iOS)
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Relevant console/network output
      description: Please copy and paste any relevant error messages or screenshots.
      render: shell
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: How badly does this affect your experience?
      options:
        - "Blocking — I cannot use the feature at all"
        - "Major — feature works but is degraded"
        - "Minor — cosmetic or edge case"
        - "Trivial — very low impact"
    validations:
      required: true
